# Imagen del modo web para la Raspberry Pi (arm64), compilada en GitHub en vez de en
# la propia Pi: allí la compilación compite con las transferencias por la CPU.
# Se publica en ghcr.io/neoalarrode/movistar-webdav-proxy-web:<commit corto> y
# :web-client-wip; la Pi solo la descarga.
name: Imagen web arm64

on:
  push:
    branches: [ web-client-wip ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: web-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Short commit
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile.web
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/neoalarrode/movistar-webdav-proxy-web:${{ steps.sha.outputs.short }}
            ghcr.io/neoalarrode/movistar-webdav-proxy-web:web-client-wip
          cache-from: type=gha
          cache-to: type=gha,mode=max
